plugins { id 'com.android.application' }
android {
    namespace 'com.aveo.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aveo.launcher'
        minSdk 29
        targetSdk 29
        versionCode 3
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}
